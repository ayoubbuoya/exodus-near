<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080c14" />
    <script>
      try {
        const theme =
          localStorage.getItem('exodus-near-theme') === 'light'
            ? 'light'
            : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'light' ? '#eef2f8' : '#080c14';
      } catch {}
    </script>
    <title>Exodus — Your yield. Your terms.</title>
    <meta
      name="description"
      content="Permissionless fixed yield protocol on NEAR Protocol. Split LSTs into Principal Tokens (PT) and Yield Tokens (YT) with Pendle V2 logit curve AMM."
    />
    <link
      rel="preload"
      href="/fonts/public-sans-variable.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
