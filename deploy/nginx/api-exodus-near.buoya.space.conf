# STEP 2 (final) config for api-exodus-near.buoya.space.
# Use this only after certbot has created /etc/letsencrypt/live/api-exodus-near.buoya.space/.

server {
    listen 80;
    listen [::]:80;
    server_name api-exodus-near.buoya.space;

    # Keep this so certbot-renew can renew the certificate.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api-exodus-near.buoya.space;

    ssl_certificate     /etc/letsencrypt/live/api-exodus-near.buoya.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-exodus-near.buoya.space/privkey.pem;

    # Resolve the backend at request time through Docker's DNS (127.0.0.11)
    # instead of at startup. Without this, nginx fails to start or reload
    # whenever exodus-near-backend is down, and that would break every
    # other site this nginx serves.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $exodus_backend http://exodus-near-backend:3001;

    location / {
        proxy_pass $exodus_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
