# STEP 1 config for api-exodus-near.buoya.space: HTTP only.
# Use this first, so certbot can answer the ACME challenge before any
# certificate exists. nginx refuses to start if a config points at a missing
# certificate, which would also take down the other sites on this nginx.
# Replace it with api-exodus-near.buoya.space.conf once the certificate has been issued.

server {
    listen 80;
    listen [::]:80;
    server_name api-exodus-near.buoya.space;

    # Must match the webroot your certbot container writes to.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
